services:
  db:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate() }"']
      interval: 5s
      retries: 20
    volumes:
      - db_data:/data/db

volumes:
  db_data:
